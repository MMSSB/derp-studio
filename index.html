<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Derp Studio | Monochrome Master</title>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Nunito:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Exact Grayscale Palette from Uploaded Image */
            --c-lightest: #e5e5e5;
            --c-light: #bcbcbc;
            --c-mid: #8c8c8c;
            --c-dark: #595959;
            --c-darkest: #000000;
            --c-panel: #111111;
            --c-card: #222222;

            /* UI Mapping */
            --bg-page: var(--c-darkest);
            --bg-panel: var(--c-panel);
            --bg-card: var(--c-card);
            --bg-card-hover: var(--c-dark);
            --primary-accent: var(--c-lightest);
            --primary-hover: #ffffff;
            --text-main: var(--c-lightest);
            --text-muted: var(--c-mid);
            --border: var(--c-dark);
            --shadow-glow: 0 0 20px rgba(229, 229, 229, 0.2);
            
            --radius-lg: 32px;
            --radius-md: 16px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh; /* Dynamic viewport height for perfect mobile fit */
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 0%, var(--c-dark), var(--c-darkest) 70%);
        }

        /* Modern Workspace Layout */
        .workspace {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: var(--radius-lg);
            border: 1px solid var(--c-dark);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 1);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* LEFT: Canvas Area */
        .canvas-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--c-dark);
            position: relative;
            background: var(--c-lightest); /* Default MS Paint Canvas */
            transition: background-color 0.4s ease;
        }

        .header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
            color: white;
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
        }

        .brand { display: flex; flex-direction: column; }
        .brand strong { 
            font-family: 'Nunito', sans-serif; 
            font-size: 24px; 
            font-weight: 900; 
            letter-spacing: 1px; 
            display: flex; align-items: center; gap: 10px; 
            color: var(--c-lightest);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .brand span { font-size: 12px; color: var(--c-light); font-weight: 600; letter-spacing: 2px; text-transform: uppercase;}

        .actions { display: flex; gap: 10px; }

        .btn {
            width: 44px; height: 44px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--c-dark);
            background: rgba(34, 34, 34, 0.8);
            backdrop-filter: blur(5px);
            color: var(--text-main);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 22px;
        }
        .btn:hover { background: var(--bg-card-hover); transform: translateY(-3px) scale(1.05); }
        .btn:active { transform: scale(0.95); }
        .btn.primary { background: var(--text-main); color: var(--c-darkest); border-color: var(--text-main); }
        .btn.primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-glow); }

        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 80px 20px 90px 20px;
            background-image: radial-gradient(rgba(0,0,0,0.15) 2px, transparent 2px);
            background-size: 20px 20px;
        }

        .preview-container svg {
            width: 100%; height: 100%;
            max-width: 500px; max-height: 500px;
            filter: drop-shadow(0 25px 35px rgba(0,0,0,0.3));
            animation: float 5s ease-in-out infinite;
            transition: all 0.3s;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* Color Controls Bar */
        .color-controls {
            position: absolute;
            bottom: 25px; left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 17, 17, 0.9);
            backdrop-filter: blur(20px);
            padding: 12px 25px;
            border-radius: 40px;
            border: 1px solid var(--c-dark);
            display: flex;
            gap: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            z-index: 10;
        }

        .color-picker-group { display: flex; align-items: center; gap: 6px; flex-direction: column;}
        .color-picker-group span { font-size: 10px; font-weight: 800; color: var(--c-mid); text-transform: uppercase; letter-spacing: 1px;}

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 0 0 2px var(--c-dark), 0 4px 6px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        input[type="color"]:hover { transform: scale(1.15); box-shadow: 0 0 0 2px var(--c-lightest); }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

        /* RIGHT: Tools Area */
        .tools-section {
            width: 520px;
            display: flex;
            flex-direction: column;
            background: rgba(17, 17, 17, 0.7);
            position: relative;
            z-index: 20;
        }

        .mobile-drag-handle { display: none; }

        .tabs {
            display: flex;
            padding: 25px 20px 0 20px;
            gap: 10px;
            overflow-x: auto;
            border-bottom: 1px solid var(--c-dark);
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            background: transparent;
            border: none;
            padding: 14px 18px;
            color: var(--c-mid);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tab i { font-size: 20px; }
        .tab:hover { color: var(--text-main); background: rgba(255,255,255,0.05); border-radius: 12px 12px 0 0; }
        .tab.active { color: var(--c-lightest); border-bottom-color: var(--c-lightest); }

        .options-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .options-scroll::-webkit-scrollbar { width: 6px; }
        .options-scroll::-webkit-scrollbar-thumb { background-color: var(--c-dark); border-radius: 10px; }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
            gap: 15px;
        }

        .option-card {
            aspect-ratio: 1;
            background: var(--bg-card);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .option-card svg {
            width: 125%; height: 125%;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .option-card:hover {
            background: var(--bg-card-hover);
            transform: scale(1.08) translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-color: var(--c-mid);
            z-index: 2;
        }

        .option-card.active {
            border-color: var(--c-lightest);
            background: var(--c-dark);
            box-shadow: inset 0 0 0 2px var(--c-lightest), var(--shadow-glow);
        }

        .empty-icon { font-size: 28px; color: var(--c-dark); }

        .mobile-edit-btn { display: none; }
        .tools-close-btn { display: none; }

        /* Mobile Responsive Bottom Sheet */
        @media (max-width: 900px) {
            body { padding: 0; }
            .workspace { flex-direction: column; height: 100dvh; max-height: none; border-radius: 0; border: none;}
            
            .canvas-section { 
                flex: 1; 
                border-right: none; 
                padding-bottom: 60px;
            }
            .preview-container { padding: 60px 10px 120px 10px; }
            
            .mobile-edit-btn {
                display: flex;
                position: absolute;
                bottom: 95px;
                left: 50%;
                transform: translateX(-50%);
                padding: 14px 28px;
                border-radius: 30px;
                background: var(--text-main);
                color: var(--c-darkest);
                font-weight: 800;
                font-size: 16px;
                align-items: center;
                gap: 8px;
                border: none;
                box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                z-index: 5;
                transition: all 0.3s;
                cursor: pointer;
            }
            .mobile-edit-btn.hidden {
                opacity: 0;
                pointer-events: none;
                transform: translate(-50%, 20px);
            }

            /* Make color controls scrollable horizontally on small screens */
            .color-controls { 
                bottom: 20px; 
                width: 95%; 
                justify-content: flex-start; 
                padding: 12px 20px; 
                overflow-x: auto; 
                scrollbar-width: none; 
            }
            .color-controls::-webkit-scrollbar { display: none; }

            .tools-section {
                position: absolute;
                bottom: 0; left: 0; right: 0;
                height: 70dvh;
                background: rgba(17, 17, 17, 0.95);
                backdrop-filter: blur(30px);
                border-radius: 35px 35px 0 0;
                border-top: 1px solid var(--c-dark);
                box-shadow: 0 -10px 50px rgba(0,0,0,0.8);
                transform: translateY(100%); /* Fully Collapsed state */
                transition: transform 0.4s cubic-bezier(0.3, 1, 0.3, 1);
                width: 100%;
                z-index: 30;
            }

            .tools-section.open {
                transform: translateY(0);
            }
            
            .tools-close-btn {
                display: flex;
                position: absolute;
                top: 20px;
                right: 20px;
                width: 36px;
                height: 36px;
                border-radius: 50%;
                background: rgba(255,255,255,0.1);
                color: white;
                border: none;
                justify-content: center;
                align-items: center;
                font-size: 20px;
                z-index: 40;
                cursor: pointer;
            }

            .mobile-drag-handle {
                display: none; /* Replaced by explicit buttons */
            }

            .tabs { padding: 0 60px 0 20px; } /* Leave space for close button */
            .options-grid { grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 12px; }
            .preview-container svg { animation: none; } /* Save battery on mobile */
        }
    </style>
</head>
<body>

<div class="workspace">
    <!-- LEFT: Canvas -->
    <div class="canvas-section" id="canvas-bg">

            <div class="brand">

                <span>Monochrome Series</span>
            </div>
            <div class="actions">
                <button class="btn" onclick="randomize()" title="Randomize Chaos"><i class="ph-bold ph-dice-five"></i></button>
                <button class="btn" onclick="clearAvatar()" title="Reset"><i class="ph-bold ph-trash"></i></button>
                <button class="btn primary" onclick="downloadPNG()" title="Download Masterpiece"><i class="ph-bold ph-download-simple"></i></button>
            </div>
        </div>
        
        <div class="preview-container" id="main-preview">
            <!-- Dynamic SVG goes here -->
        </div>

        <div class="color-controls">

            <div class="color-picker-group">

            <div class="color-picker-group">
                <span>Accent</span>
                <input type="color" id="col-sec" value="#bcbcbc" onchange="updateColors()">

        </div>

        <button class="mobile-edit-btn" id="mobile-edit-btn" onclick="openMobileMenu()">
            <i class="ph-bold ph-pencil-simple"></i> Edit Avatar
        </button>
    </div>

    <!-- RIGHT: Tools (Bottom Sheet on Mobile) -->
    <div class="tools-section" id="tools-panel">
        <button class="tools-close-btn" onclick="closeMobileMenu()"><i class="ph-bold ph-x"></i></button>
        <div class="tabs" id="tabs">

            <button class="tab" data-tab="pet"><i class="ph-bold ph-cat"></i> Pets</button>
        </div>
        <div class="options-scroll">
            <div class="options-grid" id="options-grid">
                <!-- Options injected here via JS -->
            </div>
        </div>
    </div>
</div>

            { id: 'p6', svg: `<g transform="translate(230, 200) scale(0.4)"><path d="M 120 180 C 110 110, 280 110, 270 180 C 260 240, 130 240, 120 180 Z" fill="[SKIN]" stroke="#000" stroke-width="10"/><circle cx="165" cy="165" r="5" fill="#000" /><circle cx="215" cy="170" r="5" fill="#000" /><path d="M 180 195 Q 195 205 210 195" stroke="#000" stroke-width="10" fill="none" /><path d="M 195 240 L 205 380" stroke="#000" stroke-width="10" fill="none" /><path d="M 200 270 L 110 290 M 200 270 L 290 320" stroke="#000" stroke-width="10" fill="none" /></g>` }, 
            { id: 'p7', svg: `<g transform="translate(220, 300)"><path d="M 0 60 C -10 20, 50 20, 40 60 C 20 50, 10 70, 0 60 Z" fill="[PRIM]" stroke="[SKIN]" stroke-width="6"/><circle cx="15" cy="45" r="2" fill="#000"/><circle cx="25" cy="45" r="2" fill="#000"/></g>` }, 
            { id: 'p8', svg: `<g transform="translate(-70, 280)"><rect x="0" y="0" width="80" height="50" rx="10" fill="[SEC]" stroke="[SKIN]" stroke-width="6"/><circle cx="20" cy="20" r="4" fill="#000"/><circle cx="60" cy="20" r="4" fill="#000"/><path d="M 30 30 L 50 30" stroke="#000" stroke-width="4"/></g>` } 
        ]
    };

    // --- 2. STATE MANAGEMENT ---
    let currentTab = 'head';
    let state = {
        body: 'b0', face: 'f1', head: 'h0', item: 'i0', glasses: 'g0', pet: 'p0',
        colors: { bg: '#e5e5e5', skin: '#000000', prim: '#595959', sec: '#bcbcbc' }
    };

    const previewContainer = document.getElementById('main-preview');
    const optionsGrid = document.getElementById('options-grid');
    const tabs = document.querySelectorAll('.tab');
    const canvasBg = document.getElementById('canvas-bg');
    const toolsPanel = document.getElementById('tools-panel');

    // --- 3. MOBILE MENU LOGIC ---
    let isMenuOpen = false;
    
    function openMobileMenu() {
        if (window.innerWidth > 900) return;
        isMenuOpen = true;
        toolsPanel.classList.add('open');
        document.getElementById('mobile-edit-btn').classList.add('hidden');
    }

    function closeMobileMenu() {
        if (window.innerWidth > 900) return;
        isMenuOpen = false;
        toolsPanel.classList.remove('open');
        document.getElementById('mobile-edit-btn').classList.remove('hidden');
    }

    // Close menu when clicking the canvas area
    canvasBg.addEventListener('click', (e) => {
        if (window.innerWidth <= 900 && isMenuOpen) {
            // Do not close if they clicked the color controls, header, or edit button itself
            if (!e.target.closest('.color-controls') && !e.target.closest('.header') && !e.target.closest('.mobile-edit-btn')) {
                closeMobileMenu();
            }
        }
    });

    // Expand menu on tab click in mobile
    tabs.forEach(tab => {
        tab.addEventListener('click', (e) => {
            if (window.innerWidth <= 900 && !isMenuOpen) {
                openMobileMenu();
            }
            tabs.forEach(t => t.classList.remove('active'));
            e.currentTarget.classList.add('active');
            currentTab = e.currentTarget.getAttribute('data-tab');
            e.currentTarget.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            renderGrid();
        });
    });

    // --- 4. RENDERING ENGINE ---
    function applyColors(svgStr) {
        if (!svgStr) return '';
        return svgStr
            .replace(/\[SKIN\]/g, state.colors.skin)
            .replace(/\[PRIM\]/g, state.colors.prim)
            .replace(/\[SEC\]/g, state.colors.sec);
    }

    function getCombinedSVG(isThumb = false, thumbCategory = null, thumbId = null) {
        const drawOrder = ['pet', 'body', 'baseHead', 'face', 'head', 'item', 'glasses'];
        let innerContent = '';

        drawOrder.forEach(category => {
            if (category === 'baseHead') {
                innerContent += applyColors(BASE_HEAD_SVG);
            } else {
                let selectedId = state[category];
                if (isThumb && category === thumbCategory) {
                    selectedId = thumbId;
                }
                const asset = rawAssets[category].find(a => a.id === selectedId);
                if (asset && asset.svg) {
                    innerContent += applyColors(asset.svg);
                }
            }
        });

        let viewBox = "-30 -40 460 500"; 
        
        if (isThumb) {
            if (['face', 'glasses', 'item', 'head'].includes(thumbCategory)) viewBox = "80 20 230 230";
            else if (thumbCategory === 'body') viewBox = "40 160 320 320";
            else if (thumbCategory === 'pet') viewBox = "-20 -20 440 440";
        }
        
        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${viewBox}" width="100%" height="100%">
                    ${innerContent}
                </svg>`;
    }

    function updatePreview() {
        canvasBg.style.backgroundColor = state.colors.bg;
        const existingSvg = previewContainer.querySelector('svg');
        if (existingSvg) existingSvg.remove();
        previewContainer.insertAdjacentHTML('afterbegin', getCombinedSVG(false));
    }

    function renderGrid() {
        optionsGrid.innerHTML = '';
        const currentOptions = rawAssets[currentTab];

        currentOptions.forEach((option, index) => {
            const card = document.createElement('div');
            card.className = `option-card ${state[currentTab] === option.id ? 'active' : ''}`;
            
            // Staggered pop-in animation
            card.style.animation = `popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) ${index * 0.02}s both`;
            
            if (option.svg === '') {
                card.innerHTML = `<span class="empty-icon"><i class="ph-bold ph-prohibit"></i></span>`;
            } else {
                card.innerHTML = getCombinedSVG(true, currentTab, option.id);
            }

            card.onclick = () => {
                state[currentTab] = option.id;
                renderGrid();
                updatePreview();
            };

            optionsGrid.appendChild(card);
        });
    }

    // --- 5. LOGIC & CONTROLS ---
    function updateColors() {
        state.colors.bg = document.getElementById('col-bg').value;
        state.colors.skin = document.getElementById('col-skin').value;
        state.colors.prim = document.getElementById('col-prim').value;
        state.colors.sec = document.getElementById('col-sec').value;
        renderGrid();
        updatePreview();
    }

    function randomize() {
        Object.keys(state).forEach(category => {
            if (category !== 'colors') {
                const options = rawAssets[category];
                const randomAsset = options[Math.floor(Math.random() * options.length)];
                state[category] = randomAsset.id;
            }
        });
        
        // Randomly select colors from the grayscale palette specifically to keep the theme
        const palette = ['#e5e5e5', '#bcbcbc', '#8c8c8c', '#595959', '#000000'];
        const rColor = () => palette[Math.floor(Math.random() * palette.length)];
        
        state.colors.bg = rColor();
        state.colors.skin = rColor();
        state.colors.prim = rColor();
        state.colors.sec = rColor();
        
        // Avoid pure black on black
        if (state.colors.bg === state.colors.skin && state.colors.bg === '#000000') {
            state.colors.skin = '#e5e5e5';
        }

        document.getElementById('col-bg').value = state.colors.bg;
        document.getElementById('col-skin').value = state.colors.skin;
        document.getElementById('col-prim').value = state.colors.prim;
        document.getElementById('col-sec').value = state.colors.sec;

        renderGrid();
        updatePreview();
    }

    function clearAvatar() {
        state.body = 'b0'; state.face = 'f1'; state.head = 'h0'; state.item = 'i0'; state.glasses = 'g0'; state.pet = 'p0';
        state.colors = { bg: '#e5e5e5', skin: '#000000', prim: '#595959', sec: '#bcbcbc' };
        
        document.getElementById('col-bg').value = state.colors.bg;
        document.getElementById('col-skin').value = state.colors.skin;
        document.getElementById('col-prim').value = state.colors.prim;
        document.getElementById('col-sec').value = state.colors.sec;

        renderGrid();
        updatePreview();
    }

    function downloadPNG() {
        const svgString = getCombinedSVG(false);
        const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(blob);
        
        const image = new Image();
        image.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 1200; canvas.height = 1200;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = state.colors.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(image, 50, 50, 1100, 1100);
            
            const pngURL = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = pngURL;
            downloadLink.download = 'derp-masterpiece-monochrome.png';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(blobURL);
        };
        image.src = blobURL;
    }

    // Init values
    document.getElementById('col-bg').value = state.colors.bg;
    document.getElementById('col-skin').value = state.colors.skin;
    document.getElementById('col-prim').value = state.colors.prim;
    document.getElementById('col-sec').value = state.colors.sec;

    updatePreview();
    renderGrid();

</script>
</body>
</html>
